name: Build DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools not found" }
          "VSDEVCMD=$installation\Common7\Tools\VsDevCmd.bat" >> $env:GITHUB_ENV

      - name: Build sp_listen.dll
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /LD /O2 /EHsc /std:c++17 /DNDEBUG src\sp_listen.cpp /Fe:sp_listen.dll /link psapi.lib
          if errorlevel 1 exit /b 1

      - name: Package DLL and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item sp_listen.dll, tools\host_fpp.bat, tools\host_tpp.bat, tools\dxgi.dll, tools\DList.ini -Destination package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sp_listen-windows-x64
          path: package/
          if-no-files-found: error
